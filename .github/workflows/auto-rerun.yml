name: Auto Rerun Failed CI

# Run when the main workflow completes
on:
  workflow_run:
    workflows: ["Portfolio CI/CD Pipeline"]
    types: [completed]

permissions:
  actions: write   # allow rerun

jobs:
  rerun-once:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed workflow run
        run: |
          echo "Re-running workflow run ${{ github.event.workflow_run.id }} (attempt ${{ github.event.workflow_run.run_attempt }})"
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun"